<html lang="en">
<head>

<style>

    --side-bg:#12161C; --side-hover:#1B222C; --side-active:#232C38;
    --side-text:#AEB7C0; --side-text-dim:#6C7580;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .appshell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  @media (max-width:820px){.appshell{grid-template-columns:1fr;}}

  .sidebar{background:var(--side-bg);color:var(--side-text);padding:22px 14px 24px;display:flex;flex-direction:column;gap:20px;}
  @media (max-width:820px){.sidebar{padding:16px 14px 10px;}}
  .brandmark{padding:0 8px;}
  .wordmark{font-family:var(--serif);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:#fff;line-height:1;}
  .wordmark small{display:block;font-family:var(--sans);font-weight:500;font-size:.62rem;letter-spacing:.08em;color:var(--amber);margin-top:5px;text-transform:uppercase;}

  .save-flash{font-size:.7rem;color:var(--amber);opacity:0;transition:opacity .25s ease;display:block;margin-top:8px;}

  nav.tabs{display:flex;flex-direction:column;gap:2px;}
  @media (max-width:820px){nav.tabs{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;-webkit-overflow-scrolling:touch;}}
  .nav-group-label{font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--side-text-dim);padding:14px 10px 4px;text-transform:uppercase;}
  .nav-group-label:first-child{padding-top:2px;}
  @media (max-width:820px){.nav-group-label{display:none;}}

  nav.tabs button.active{background:var(--side-active);color:#fff;font-weight:600;}
  nav.tabs button:hover{background:var(--side-hover);color:#fff;}

  .mainarea{padding:22px 22px 90px;min-width:0;}
  @media (max-width:820px){.mainarea{padding:16px 14px 80px;}}

  h2.title{font-family:var(--serif);font-weight:700;font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em;}
  p.sub{margin:0 0 20px;color:var(--text-dim);font-size:.88rem;}
  .grid{display:grid;gap:16px;}
  .cols-2{grid-template-columns:1fr 1fr;}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:760px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}}
  .card{border:1px solid var(--line);border-radius:8px;padding:16px;background:#F5F6F6;}
  .card .k{font-size:.74rem;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
  .card .v{font-size:1.5rem;font-family:var(--serif);font-weight:700;}
  .card .v.pos{color:var(--teal);}
  .card .v.neg{color:var(--error);}
  .health-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .pill{display:flex;align-items:center;gap:6px;font-size:.8rem;padding:6px 12px;border-radius:20px;background:var(--teal-dim);color:#163F35;font-weight:600;}
  .pill.warn{background:var(--amber-dim);color:#4A3316;}
  .pill.crit{background:var(--error-dim);color:#4A180F;}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .insight{background:var(--teal-dim);border-left:3px solid var(--teal);border-radius:6px;padding:16px 18px;margin-bottom:20px;}
  .insight h3{margin:0 0 8px;font-size:.82rem;color:var(--teal);font-weight:700;}
  .insight p{margin:0;font-size:.9rem;line-height:1.55;color:#163F35;}

  .status-tag{font-size:.72rem;padding:3px 9px;border-radius:12px;font-weight:600;display:inline-block;}
  .status-tag.income{background:var(--teal-dim);color:#163F35;}
  .status-tag.expense{background:var(--error-dim);color:#4A180F;}
  .status-tag.lead{background:var(--amber-dim);color:#4A3316;}
  .status-tag.customer{background:var(--teal-dim);color:#163F35;}
  .status-tag.inactive{background:#EDEBE4;color:var(--text-dim);}
  form.inline-form{display:grid;gap:10px;margin-bottom:18px;padding:16px;border:1px dashed var(--line);border-radius:8px;background:#F5F6F6;}
  form.inline-form .row{display:grid;gap:10px;}
  .field label{display:block;font-size:.76rem;font-weight:600;margin-bottom:4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:.85rem;font-family:var(--sans);background:#fff;}
  textarea{resize:vertical;min-height:60px;}
  .btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:6px;font-size:.82rem;font-weight:600;}
  .btn.primary{background:var(--amber);color:#fff;}
  .btn.primary:hover{background:#8F6524;}
  .btn.ghost{color:var(--text-dim);}
  .btn.ghost:hover{color:var(--ink);}
  .btn.danger{color:var(--error);}
  .btn.small{padding:5px 10px;font-size:.74rem;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .empty{padding:28px;text-align:center;color:var(--text-dim);font-size:.88rem;border:1px dashed var(--line);border-radius:8px;}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;overflow-x:auto;}
  @media (max-width:900px){.board{grid-template-columns:1fr;}}
  .stage-col{background:#F5F6F6;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:80px;}
  .stage-col h4{margin:0 0 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);}
  .deal-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px;font-size:.8rem;}
  .deal-card .amt{font-weight:700;color:var(--teal);font-size:.82rem;}
  .deal-card select{margin-top:6px;font-size:.72rem;padding:4px 6px;}
  .save-flash{font-size:.76rem;color:var(--teal);opacity:0;transition:opacity .25s ease;}
  .save-flash.show{opacity:1;}
  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .content-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .content-item .meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text-dim);margin-bottom:6px;}
  .badge{font-size:.68rem;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--ink-soft);font-weight:600;}
  .ai-loading{font-size:.8rem;color:var(--text-dim);font-style:italic;}
  .doc-flag{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:700;}
  .doc-flag.expiring{background:var(--amber-dim);color:#4A3316;}
  .doc-flag.expired{background:var(--error-dim);color:#4A180F;}
  .doc-flag.ok{background:var(--teal-dim);color:#163F35;}
  .role-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .role-card h4{margin:0 0 4px;font-size:.86rem;}
  .role-card p{margin:0;font-size:.8rem;color:var(--text-dim);line-height:1.5;}
  .rule-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .rule-card h4{margin:0 0 4px;font-size:.88rem;}
  .rule-card p{margin:0 0 6px;font-size:.8rem;color:var(--text-dim);line-height:1.5;}
  .toggle{position:relative;width:38px;height:20px;flex:none;}
  .toggle input{opacity:0;width:0;height:0;position:absolute;}
  .toggle .track{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s;}
  .toggle .track:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .toggle input:checked + .track{background:var(--teal);}
  .toggle input:checked + .track:before{transform:translateX(18px);}
  .log-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.82rem;}
  .log-row:last-child{border-bottom:none;}
  .log-row .ts{color:var(--text-dim);white-space:nowrap;font-size:.72rem;min-width:118px;}
  .log-row .area{font-weight:700;min-width:80px;}
  .warn-box{background:var(--amber-dim);border:1px solid var(--amber);border-radius:6px;padding:12px 14px;font-size:.82rem;line-height:1.5;color:#4A3316;margin-bottom:18px;}
  @media print{
    body{background:#fff;}
    .no-print, nav.tabs, .sidebar{display:none !important;}
    .appshell{display:block;}
    .mainarea{padding:0;}
    .panel{border:none;padding:0;}
  }
</style>

<textarea id="setupAssistantSource" style="display:none" aria-hidden="true">
# Business Setup &amp; Operations Assistant — Project Instructions

Paste this into a new Claude Project's custom instructions. This is the "live" half of the Business OS — it runs the setup wizard, connects real accounts, and acts as an ongoing operations assistant. It's meant to be used alongside the Business OS HTML dashboard, which holds the structured records (finance log, customers, pipeline, tasks, documents, automations, audit log).

---

## Role

You are this business's setup assistant and ongoing operations advisor. You help a small business owner get organized and then check in as a working assistant — not a generic chatbot. You are direct, plain-spoken, and grounded only in what the owner actually tells you or what their connected accounts actually show. You never invent business facts, financial figures, customers, or results.

## First conversation: run the setup wizard

If this is a new business (the owner hasn't described their business yet), walk through these sections conversationally, one at a time — don't dump a giant form. Ask, listen, move on. Keep it short: a couple of questions per turn, not a wall of prompts.

**1. Business basics** — name, industry, location, website, hours, how long they've been operating, how many people work there.

**2. What they sell** — products or services, rough pricing if they're comfortable sharing it.

**3. Who they serve** — their typical customer, what problem they solve for them, who they see as competitors.

**4. Brand voice** — ask them to describe their business in their own words, or describe 2–3 competitors/brands they admire and why. Don't hand them a jargon-heavy brand questionnaire; extract personality, tone, and a rough tagline from how they talk about their own business.

**5. Goals** — a revenue or profit target, a customer number, whatever they're actually tracking toward. Skip anything they don't have an answer for; mark it as open rather than guessing.

Once you have this, summarize it back in plain language and ask if it's right before treating anything as settled. Tell them to enter the same details into the **Business Setup** tab of their HTML dashboard, so both stay in sync.

## Connector setup — this is the part the HTML file can't do

This is the step that makes the "business in a box" real instead of just a tracker. Once the owner has described their business, ask what parts of running it are the most manual or annoying right now — invoicing, payments, social posting, bookkeeping, scheduling, email follow-up. Based on what they mention, search for real options rather than assuming:

- Use `search_mcp_registry` with keywords drawn from what they described (e.g. `["accounting", "invoicing"]`, `["social media", "scheduling"]`, `["payments"]`, `["calendar", "scheduling"]`).
- Present what comes back with `suggest_connectors` and let them choose. Never connect something they didn't ask for, and never assume a specific provider (Stripe vs. Square, QuickBooks vs. Xero) — offer the real options and let the owner pick.
- It's fine to offer this in stages rather than all at once — e.g. "let's get payments and accounting connected first, and come back to social media once that's running."
- If nothing relevant turns up for something they mentioned, say so plainly rather than pretending an option exists.

Once something is connected, you can act on it for real — check a real balance, pull real transactions, draft a real invoice, schedule a real post — subject to the same approval rules as everything else in this document.

## Ongoing behavior, after setup

- **Treat the HTML dashboard as the system of record.** When the owner asks how the business is doing, and they've shared dashboard figures or you can see them via a connected account, use those. Don't estimate or reconstruct numbers you don't have — say what's missing and ask for it.
- **Distinguish confirmed data from your own read on it.** "Revenue is $4,200 this month" is a fact if it came from them or a connector. "That looks strong for this point in the month" is your judgment — say it that way.
- **Three levels of action, always in this order:**
  - *Advise* — you recommend something.
  - *Prepare* — you draft it (an invoice, a post, an email) for review.
  - *Execute* — you actually send, post, charge, or delete something through a connector.
  Never jump straight to Execute. Anything in that category — sending an email, publishing a post, charging a card, issuing a refund, deleting a record — gets described first and requires an explicit yes.
- **If an action fails, say it failed.** Never report a post as published, an invoice as sent, or a payment as processed unless the tool result actually confirms it.
- **If you don't have enough information to answer something (a number, a policy, a legal or tax question), say so** and tell the owner exactly what's missing or that they should check with an accountant, bookkeeper, or lawyer — don't guess at anything with financial or legal consequences.
- **Keep recommendations grounded in what changed.** When flagging something (spending up, a lead gone quiet, a deal stalled), say what happened, why it likely matters, and what you'd do about it — not just a number with no context.

## Boundaries

- Never fabricate a transaction, customer, review, message, or "sent" action.
- Never treat an estimate or your own projection as a confirmed figure.
- Never take an Execute-level action without the owner's explicit go-ahead in that conversation.
- If the owner asks for something outside what a connected account or the dashboard actually supports, say plainly what's not possible yet rather than working around it.
</textarea>

  <aside class="sidebar">
    <div class="brandmark">
      <div class="wordmark">Foreman<small>Business OS</small></div>
      <div id="bizTitle">Business OS</div>
      <p id="bizSub">Set up your business to get started</p>
      <span class="save-flash" id="saveFlash">Saved</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </aside>

<script>
/* ========================= STATE ========================= */
const CORE_KEY = "business-os-core-v1";

function defaultState(){
  return {
    business:{name:"",industry:"",location:"",phone:"",email:"",website:"",hours:"",employees:"",established:"",goalRevenue:"",goalProfit:"",goalCustomers:""},
    brand:{tagline:"",mission:"",values:"",voice:"",audience:""},
    finance:{transactions:[]},
    customers:[],
    pipeline:[],
    tasks:[],
    content:[],
    documents:[],
    invoices:[],
    catalog:[],
    vendors:[],
    inventory:[],
    recurring:[],
    employees:[],
    payRuns:[],
    locations:[],
    taxChecklist:[],
    backendConfig:{url:"", businessId:"", apiKey:"", lastSync:""},
    budgets:{},
    bots:{},
    automations:{},
    auditLog:[],
    supervisorLog:[]
  };
}
function logAudit(action, detail){
  state.auditLog.unshift({id:uid(), ts:new Date().toISOString(), action, detail});
  if(state.auditLog.length > 300) state.auditLog.length = 300;
}
let state = defaultState();

async function loadAll(){
  try{
    const res = await window.storage.get(CORE_KEY, false);
    state = res && res.value ? Object.assign(defaultState(), JSON.parse(res.value)) : defaultState();
  }catch(e){ state = defaultState(); }
}
let saveTimer;
async function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(CORE_KEY, JSON.stringify(state), false);
      flashSaved();
    }catch(e){ console.error("save failed", e); }
  }, 250);
}
function flashSaved(){
  const el = document.getElementById("saveFlash");
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1000);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ n = Number(n)||0; return (n<0?"-$":"$")+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toCSV(headers, rows){
  const esc = (v)=>{
    v = v===undefined||v===null ? "" : String(v);
    if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  return [headers.map(esc).join(",")].concat(rows.map(r=>r.map(esc).join(","))).join("\n");
}
function downloadText(filename, text, mime){
  const blob = new Blob([text], {type: mime||"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ========================= TABS ========================= */
const TABS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"setup", label:"Business Setup"},
  {id:"finance", label:"Finance"},
  {id:"invoices", label:"Invoices"},
  {id:"recurring", label:"Recurring Revenue"},
  {id:"payroll", label:"Employees & Payroll"},
  {id:"crm", label:"Customers"},
  {id:"pipeline", label:"Sales Pipeline"},
  {id:"catalog", label:"Catalog"},
  {id:"tasks", label:"Tasks"},
  {id:"marketing", label:"Marketing"},
  {id:"vendors", label:"Vendors"},
  {id:"inventory", label:"Inventory & Equipment"},
  {id:"locations", label:"Locations"},
  {id:"documents", label:"Documents"},
  {id:"automations", label:"Automations"},
  {id:"bots", label:"Department Bots"},
  {id:"supervisor", label:"Supervisor"},
  {id:"connectors", label:"Connect Live Services"},
  {id:"reports", label:"Reports"},
  {id:"taxprep", label:"Tax Prep"},
  {id:"audit", label:"Audit Log"},
  {id:"backend", label:"Data & Backend"}
];
const NAV_GROUPS = [
  {label:"Overview", tabs:["dashboard","setup"]},
  {label:"Run the business", tabs:["finance","invoices","recurring","payroll","crm","pipeline","catalog","tasks","marketing","vendors","inventory","locations","documents"]},
  {label:"Intelligence", tabs:["bots","supervisor","automations"]},
  {label:"Connect", tabs:["connectors"]},
  {label:"Records", tabs:["reports","taxprep","audit","backend"]}
];
let activeTab = "dashboard";

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  NAV_GROUPS.forEach(group=>{
    const label = document.createElement("div");
    label.className = "nav-group-label";
    label.textContent = group.label;
    nav.appendChild(label);
    group.tabs.forEach(id=>{
      const t = TABS.find(x=>x.id===id);
      if(!t) return;
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = t.id===activeTab ? "active" : "";
      b.onclick = ()=>{ activeTab=t.id; render(); };
      nav.appendChild(b);
    });
  });
}

function updateHeader(){
  document.getElementById("bizTitle").textContent = state.business.name || "Business OS";
  document.getElementById("bizSub").textContent = state.business.industry
    ? state.business.industry + (state.business.location ? " · " + state.business.location : "")
    : "Set up your business to get started";
}

/* ========================= DASHBOARD ========================= */
function computeFinance(){
  const tx = state.finance.transactions;
  const income = tx.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount||0),0);
  const expense = tx.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount||0),0);
  return {income, expense, profit: income-expense};
}
function computeMonthFinance(){
  const now = new Date();
  const tx = state.finance.transactions.filter(t=>{
    const d = new Date(t.date);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
  const income = tx.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount||0),0);
  const expense = tx.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount||0),0);
  return {income, expense, profit: income-expense};
}
function extractNumber(str){
  if(!str) return null;
  const m = String(str).replace(/,/g,"").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function computeGoals(){
  const mf = computeMonthFinance();
  const goals = [];
  const rev = extractNumber(state.business.goalRevenue);
  if(rev!==null) goals.push({label:"Monthly revenue", goal:rev, current:mf.income, unit:"$"});
  const prof = extractNumber(state.business.goalProfit);
  if(prof!==null) goals.push({label:"Monthly profit", goal:prof, current:mf.profit, unit:"$"});
  const cust = extractNumber(state.business.goalCustomers);
  if(cust!==null) goals.push({label:"Customers", goal:cust, current:state.customers.length, unit:""});
  return goals;
}

function computeHealth(){
  const f = computeFinance();
  const tags = [];
  // financial
  if(state.finance.transactions.length===0) tags.push({label:"Financial", level:"warn", note:"No transactions logged yet"});
  else if(f.profit < 0) tags.push({label:"Financial", level:"crit", note:"Running at a loss"});
  else if(f.expense > f.income*0.85) tags.push({label:"Financial", level:"warn", note:"Expenses close to revenue"});
  else tags.push({label:"Financial", level:"ok", note:"Healthy margin"});
  // sales
  const openDeals = state.pipeline.filter(d=>d.stage!=="Won"&&d.stage!=="Lost").length;
  if(state.pipeline.length===0) tags.push({label:"Sales", level:"warn", note:"No pipeline activity"});
  else tags.push({label:"Sales", level:"ok", note:openDeals+" open deal"+(openDeals===1?"":"s")});
  // customers
  const followUps = state.customers.filter(c=>c.followUp && new Date(c.followUp) <= new Date()).length;
  if(followUps>0) tags.push({label:"Customers", level:"warn", note:followUps+" follow-up"+(followUps===1?"":"s")+" due"});
  else tags.push({label:"Customers", level:"ok", note:state.customers.length+" on file"});
  // operations
  const overdueTasks = state.tasks.filter(t=>t.status!=="Done" && t.due && new Date(t.due) < new Date()).length;
  if(overdueTasks>0) tags.push({label:"Operations", level:"crit", note:overdueTasks+" task"+(overdueTasks===1?"":"s")+" overdue"});
  else tags.push({label:"Operations", level:"ok", note:"On track"});
  // marketing
  const scheduled = state.content.filter(c=>c.status==="Scheduled"||c.status==="Draft").length;
  tags.push({label:"Marketing", level: scheduled>0 ? "ok" : "warn", note: scheduled>0 ? scheduled+" item"+(scheduled===1?"":"s")+" in calendar" : "Nothing planned"});
  const deptMap = {Financial:"finance", Sales:"sales", Customers:"customers", Operations:"operations", Marketing:"marketing"};
  tags.forEach(t=>{
    const n = botName(deptMap[t.label]);
    if(n) t.label = `${t.label} (${n})`;
  });
  return tags;
}

function computeInsight(){
  const f = computeFinance();
  const overdueTasks = state.tasks.filter(t=>t.status!=="Done" && t.due && new Date(t.due) < new Date());
  const followUps = state.customers.filter(c=>c.followUp && new Date(c.followUp) <= new Date());
  if(state.finance.transactions.length===0 && state.customers.length===0 && state.tasks.length===0){
    return "Nothing logged yet. Start by adding your business details, then log a transaction or a customer — insights here are calculated directly from what you enter, never guessed.";
  }
  if(overdueTasks.length>0){
    return `You have ${overdueTasks.length} overdue task${overdueTasks.length===1?"":"s"}, including "${overdueTasks[0].title}". Clearing these first keeps small problems from becoming bigger ones.`;
  }
  if(followUps.length>0){
    return `${followUps.length} customer${followUps.length===1?" has":"s have"} a follow-up due, including ${followUps[0].name}. Reaching out today keeps the relationship warm.`;
  }
  if(f.expense > f.income && f.income>0){
    return `Expenses ($${f.expense.toFixed(0)}) are currently ahead of revenue ($${f.income.toFixed(0)}). Worth reviewing your largest expense category before it compounds.`;
  }
  if(state.pipeline.filter(d=>d.stage==="Quote"||d.stage==="Negotiation").length>0){
    const n = state.pipeline.filter(d=>d.stage==="Quote"||d.stage==="Negotiation").length;
    return `You have ${n} deal${n===1?"":"s"} sitting at Quote or Negotiation. Following up on these directly is usually higher-leverage than new lead generation right now.`;
  }
  return "Nothing urgent flagged. Good time to work on marketing content or reach out to recent customers.";
}

function computeMonthCategoryActual(category){
  const now = new Date();
  return state.finance.transactions
    .filter(t=>t.type==="expense" && t.category===category)
    .filter(t=>{ const d=new Date(t.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); })
    .reduce((s,t)=>s+Number(t.amount||0),0);
}
function budgetStatus(actual, budgeted){
  if(budgeted<=0) return "ok";
  const pct = actual/budgeted;
  if(pct>1) return "crit";
  if(pct>=0.8) return "warn";
  return "ok";
}

    saveState();
  };
  document.getElementById("txForm").onsubmit = (e)=>{
    e.preventDefault();
    const amount = parseFloat(val("tx_amount"));
    if(!amount || !val("tx_category")) return;
    const type = document.getElementById("tx_type").value, category = val("tx_category");
    state.finance.transactions.push({id:uid(), type, category, amount, date:val("tx_date")||new Date().toISOString().slice(0,10), notes:val("tx_notes")});
    logAudit("Finance", `Logged ${type}: ${category} (${money(amount)})`);
    saveState(); renderFinance(panel);
  };
  panel.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = ()=>{
      const t = state.finance.transactions.find(x=>x.id===b.dataset.del);
      state.finance.transactions = state.finance.transactions.filter(t=>t.id!==b.dataset.del);
      if(t) logAudit("Finance", `Removed transaction: ${t.category} (${money(t.amount)})`);
      saveState(); renderFinance(panel);
    };
  });
  document.getElementById("budgetForm").onsubmit = (e)=>{
    e.preventDefault();
    const cat = val("bg_category");
    const amt = parseFloat(val("bg_amount"));
    if(!cat || isNaN(amt)) return;
    state.budgets[cat] = amt;
    logAudit("Finance", `Set monthly budget for ${cat}: ${money(amt)}`);
    saveState(); renderFinance(panel);
  };
  panel.querySelectorAll("[data-delbudget]").forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.delbudget;
      delete state.budgets[cat];
      logAudit("Finance", `Removed budget for ${cat}`);
      saveState(); renderFinance(panel);
    };
  });
}

/* ========================= INVOICES ========================= */
// All money math here is computed in JS from numbers the owner enters — never
// written or estimated by AI. That boundary matters: a hallucinated total on
// a real invoice is a real problem for a real business.
let activeInvoiceId = null;
function invoiceTotal(inv){
  return inv.items.reduce((s,i)=>s+Number(i.amount||0),0);
}
function invoiceStatusDisplay(inv){
  if(inv.status==="Sent" && inv.dueDate && new Date(inv.dueDate) < new Date()) return "Overdue";
  return inv.status;
}
function renderInvoices(panel){
  const list = [...state.invoices].sort((a,b)=>b.created.localeCompare(a.created));
  panel.innerHTML = `
    <div class="toprow">
      <div><h2 class="title" style="margin-bottom:2px;">Invoices${botTag("finance")}</h2><p class="sub" style="margin:0;">Totals are computed here, not written by AI — the numbers are only ever what you enter.</p></div>
      <button class="btn ghost small" id="exportInvoices" ${list.length? "" : "disabled"}>Export CSV</button>
    </div>
    <form class="inline-form" id="invForm">
      <div class="row" style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;">
        <div class="field"><label>Customer</label><input id="inv_customer" required list="invCustList">
          <datalist id="invCustList">${state.customers.map(c=>`<option value="${escapeHtml(c.name)}">`).join("")}</datalist>
        </div>
        <div class="field"><label>Due date</label><input id="inv_due" type="date"></div>
        <div class="field"><label>Status</label><select id="inv_status"><option selected>Draft</option><option>Sent</option><option>Paid</option></select></div>
      </div>
      <div><button class="btn primary" type="submit">Create invoice</button></div>
    </form>
    <table>
      <thead><tr><th>Customer</th><th>Due</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${list.length? list.map(inv=>{
          const disp = invoiceStatusDisplay(inv);
          return `<tr>
            <td>${escapeHtml(inv.customer)}</td>
            <td>${inv.dueDate||"—"}</td>
            <td>${money(invoiceTotal(inv))}</td>
            <td><span class="status-tag ${disp==='Paid'?'customer':disp==='Overdue'?'expense':'lead'}">${disp}</span></td>
            <td><button class="btn ghost small" data-open="${inv.id}">Open</button><button class="btn ghost small" data-delinv="${inv.id}">Remove</button></td>
          </tr>`;
        }).join("") : `<tr><td colspan="5"><div class="empty">No invoices yet.</div></td></tr>`}
      </tbody>
    </table>
    <div id="invDetail" style="margin-top:22px;"></div>
  `;
  const exportBtn = document.getElementById("exportInvoices");
  if(exportBtn) exportBtn.onclick = ()=>{
    const csv = toCSV(["Customer","Due date","Total","Status"], list.map(inv=>[inv.customer,inv.dueDate,invoiceTotal(inv).toFixed(2),invoiceStatusDisplay(inv)]));
    downloadText("invoices.csv", csv);
    logAudit("Invoices", "Exported invoices CSV");
    saveState();
  };
  document.getElementById("invForm").onsubmit = (e)=>{
    e.preventDefault();
    const customer = val("inv_customer");
    if(!customer) return;
    const id = uid();
    state.invoices.push({id, customer, dueDate:val("inv_due"), status:document.getElementById("inv_status").value, items:[], created:new Date().toISOString()});
    logAudit("Invoices", `Created invoice for ${customer}`);
    activeInvoiceId = id;
    saveState(); renderInvoices(panel);
  };
  panel.querySelectorAll("[data-open]").forEach(b=>{
    b.onclick = ()=>{ activeInvoiceId = b.dataset.open; renderInvoices(panel); };
  });
  panel.querySelectorAll("[data-delinv]").forEach(b=>{
    b.onclick = ()=>{
      const inv = state.invoices.find(x=>x.id===b.dataset.delinv);
      state.invoices = state.invoices.filter(x=>x.id!==b.dataset.delinv);
      if(activeInvoiceId===b.dataset.delinv) activeInvoiceId = null;
      if(inv) logAudit("Invoices", `Removed invoice: ${inv.customer}`);
      saveState(); renderInvoices(panel);
    };
  });

  if(activeInvoiceId){
    const inv = state.invoices.find(x=>x.id===activeInvoiceId);
    if(inv) renderInvoiceDetail(panel, inv);
  }
}
function renderInvoiceDetail(panel, inv){
  const detail = document.getElementById("invDetail");
  const total = invoiceTotal(inv);
  detail.innerHTML = `
    <div class="panel" style="padding:20px;">
      <div class="toprow">
        <h3 style="font-size:.95rem;margin:0;">Invoice — ${escapeHtml(inv.customer)}</h3>
        <div>
          <button class="btn ghost small no-print" id="invPrint">Print / Save as PDF</button>
          <button class="btn ghost small no-print" id="invClose">Close</button>
        </div>
      </div>
      <p style="font-size:.8rem;color:var(--text-dim);">Due ${inv.dueDate||"—"} · Status: ${invoiceStatusDisplay(inv)}</p>
      <table style="margin:14px 0;">
        <thead><tr><th>Description</th><th style="text-align:right;">Amount</th><th class="no-print"></th></tr></thead>
        <tbody>
          ${inv.items.length? inv.items.map(i=>`<tr><td>${escapeHtml(i.desc)}</td><td style="text-align:right;">${money(i.amount)}</td><td class="no-print"><button class="btn ghost small" data-delitem="${i.id}">Remove</button></td></tr>`).join("") : `<tr><td colspan="3" style="color:var(--text-dim);">No line items yet.</td></tr>`}

      </form>
      <div class="field no-print" style="max-width:220px;margin-top:14px;"><label>Status</label>
        <select id="invStatusSelect">
          <option ${inv.status==='Draft'?'selected':''}>Draft</option>
          <option ${inv.status==='Sent'?'selected':''}>Sent</option>
          <option ${inv.status==='Paid'?'selected':''}>Paid</option>
        </select>
      </div>
    </div>
  `;
  document.getElementById("itemForm").onsubmit = (e)=>{
    e.preventDefault();
    const desc = val("item_desc");
    const amount = parseFloat(val("item_amount"));
    if(!desc || !amount) return;
    inv.items.push({id:uid(), desc, amount});
    logAudit("Invoices", `Added line item to ${inv.customer}'s invoice: ${desc} (${money(amount)})`);
    saveState(); renderInvoices(panel);
  };
  const itemDescInput = document.getElementById("item_desc");
  itemDescInput.addEventListener("input", ()=>{
    const match = state.catalog.find(c=>c.name===itemDescInput.value);
    const amountInput = document.getElementById("item_amount");
    if(match && !amountInput.value) amountInput.value = match.price;
  });
  detail.querySelectorAll("[data-delitem]").forEach(b=>{
    b.onclick = ()=>{
      inv.items = inv.items.filter(i=>i.id!==b.dataset.delitem);
      saveState(); renderInvoices(panel);
    };
  });
  document.getElementById("invStatusSelect").onchange = (e)=>{
    inv.status = e.target.value;
    logAudit("Invoices", `${inv.customer}'s invoice marked ${e.target.value}`);
    saveState(); runAutomations(); renderInvoices(panel);
  };
  document.getElementById("invClose").onclick = ()=>{ activeInvoiceId = null; renderInvoices(panel); };
  document.getElementById("invPrint").onclick = ()=>{
    logAudit("Invoices", `Printed invoice: ${inv.customer}`);
    saveState();
    window.print();
  };
}

/* ========================= PIPELINE ========================= */
const STAGES = ["Lead","Contacted","Qualified","Quote","Negotiation","Won"];
function renderPipeline(panel){
  panel.innerHTML = `
    <div class="toprow">
      <div><h2 class="title" style="margin-bottom:2px;">Sales Pipeline${botTag("sales")}</h2><p class="sub" style="margin:0;">Move deals through stages as they progress. Lost deals stay visible in the summary below.</p></div>
      <button class="btn ghost small" id="exportPipe" ${state.pipeline.length? "" : "disabled"}>Export CSV</button>
    </div>
    <form class="inline-form" id="dealForm">
      <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div class="field"><label>Customer / deal name</label><input id="d_name" required></div>
        <div class="field"><label>Value</label><input id="d_value" type="number" step="0.01" placeholder="0.00"></div>
        <div class="field"><label>Stage</label><select id="d_stage">${STAGES.map(s=>`<option>${s}</option>`).join("")}</select></div>
      </div>
      <div><button class="btn primary" type="submit">Add deal</button></div>
    </form>
    <div class="board" id="board"></div>
    <div style="margin-top:16px;" id="lostList"></div>
  `;
  const board = document.getElementById("board");
  STAGES.forEach(stage=>{
    const col = document.createElement("div");
    col.className = "stage-col";
    const deals = state.pipeline.filter(d=>d.stage===stage);
    const total = deals.reduce((s,d)=>s+Number(d.value||0),0);
    col.innerHTML = `<h4>${stage} · ${money(total)}</h4>` + (deals.length? deals.map(d=>`
      <div class="deal-card">
        <div>${escapeHtml(d.name)}</div>
        <div class="amt">${money(d.value)}</div>
        <select data-move="${d.id}">
          ${STAGES.concat("Lost").map(s=>`<option ${s===d.stage?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>`).join("") : `<div style="color:var(--text-dim);font-size:.76rem;">No deals</div>`);
    board.appendChild(col);
  });
  board.querySelectorAll("[data-move]").forEach(sel=>{
    sel.onchange = ()=>{
      const d = state.pipeline.find(x=>x.id===sel.dataset.move);
      if(d){
        const from = d.stage;
        d.stage = sel.value;
        d.stageChangedAt = new Date().toISOString().slice(0,10);
        logAudit("Pipeline", `${d.name}: ${from} → ${sel.value}`);
        saveState(); renderPipeline(panel);
      }
    };
  });
  const lost = state.pipeline.filter(d=>d.stage==="Lost");
  document.getElementById("lostList").innerHTML = lost.length ? `
    <h4 style="font-size:.76rem;color:var(--text-dim);text-transform:uppercase;">Lost (${lost.length})</h4>
    <table><tbody>${lost.map(d=>`<tr><td>${escapeHtml(d.name)}</td><td style="text-align:right;color:var(--text-dim);">${money(d.value)}</td></tr>`).join("")}</tbody></table>
  ` : "";

  const exportPipeBtn = document.getElementById("exportPipe");
  if(exportPipeBtn) exportPipeBtn.onclick = ()=>{
    const csv = toCSV(["Name","Stage","Value"], state.pipeline.map(d=>[d.name,d.stage,d.value]));
    downloadText("pipeline.csv", csv);
    logAudit("Pipeline", "Exported pipeline CSV");
    saveState();
  };
  document.getElementById("dealForm").onsubmit = (e)=>{
    e.preventDefault();
    if(!val("d_name")) return;
    const name = val("d_name"), stage = document.getElementById("d_stage").value;
    state.pipeline.push({id:uid(), name, value: parseFloat(val("d_value"))||0, stage, stageChangedAt:new Date().toISOString().slice(0,10)});
    logAudit("Pipeline", `Added deal: ${name} (${stage})`);
    saveState(); renderPipeline(panel);
  };
}

/* ========================= MARKETING ========================= */
async function callClaude(prompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:400,
      messages:[{role:"user", content: prompt}]
    })
  });
  if(!response.ok) throw new Error("API error "+response.status);
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  return textBlock ? textBlock.text : "";
}

/* ========================= RECURRING REVENUE ========================= */
function addInterval(dateStr, freq){
  const d = new Date(dateStr);
  if(freq==="weekly") d.setDate(d.getDate()+7);
  else if(freq==="yearly") d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function monthlyEquivalent(r){
  const amt = Number(r.amount||0);
  if(r.frequency==="weekly") return amt*4.345;
  if(r.frequency==="yearly") return amt/12;
  return amt;
}

/* ========================= EMPLOYEES & PAYROLL ========================= */
// Tracks gross pay only — real math, no invented numbers. Deliberately does NOT
// calculate tax withholdings, CPP/EI/social security, or net pay: that varies by
// jurisdiction and changes yearly, and getting it wrong has real consequences.
// Use dedicated payroll software or a bookkeeper for the actual remittance math.
function renderPayroll(panel){
  const emp = [...state.employees].sort((a,b)=>a.name.localeCompare(b.name));
  const runs = [...state.payRuns].sort((a,b)=>b.periodEnd.localeCompare(a.periodEnd));
  panel.innerHTML = `
    <h2 class="title">Employees & Payroll${botTag("finance")}</h2>
    <p class="sub">A roster and a gross-pay log — not a payroll processor.</p>
    <div class="warn-box"><strong>What this does not do:</strong> calculate tax withholdings, CPP/EI, social security, or net pay. Those rules vary by jurisdiction and change often — use dedicated payroll software (Wagepoint, QuickBooks Payroll, ADP, etc.) or a bookkeeper for that math. This tracks who you employ and what you paid them in gross terms, and logs it to Finance as a real expense.</p></div>

    <h3 style="font-size:.9rem;margin-bottom:10px;">Roster</h3>
    <form class="inline-form" id="empForm">
      <div class="row" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;">
        <div class="field"><label>Name</label><input id="e_name" required></div>
        <div class="field"><label>Role</label><input id="e_role"></div>
        <div class="field"><label>Pay type</label><select id="e_paytype"><option value="hourly">Hourly</option><option value="salary">Salary</option></select></div>
        <div class="field"><label>Rate</label><input id="e_rate" type="number" step="0.01" required placeholder="$/hr or $/period"></div>
      </div>
      <div><button class="btn primary" type="submit">Add to roster</button></div>
    </form>
    <table>
      <thead><tr><th>Name</th><th>Role</th><th>Pay type</th><th style="text-align:right;">Rate</th><th></th></tr></thead>
      <tbody>
        ${emp.length? emp.map(e=>`
          <tr>
            <td>${escapeHtml(e.name)}</td>
            <td>${escapeHtml(e.role||"")}</td>
            <td>${e.payType}</td>
            <td style="text-align:right;">${money(e.rate)}${e.payType==='hourly'?'/hr':'/period'}</td>
            <td><button class="btn ghost small" data-delemp="${e.id}">Remove</button></td>
          </tr>`).join("") : `<tr><td colspan="5"><div class="empty">No one on the roster yet.</div></td></tr>`}
      </tbody>
    </table>

    <h3 style="font-size:.9rem;margin:26px 0 10px;">Log a pay run</h3>
    <form class="inline-form" id="payForm">
      <div class="row" style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;">
        <div class="field"><label>Employee</label><select id="p_emp">${emp.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Period start</label><input id="p_start" type="date"></div>
        <div class="field"><label>Period end</label><input id="p_end" type="date"></div>
      </div>
      <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field"><label>Hours worked (hourly only)</label><input id="p_hours" type="number" step="0.25"></div>
        <div class="field"><label>Gross pay</label><input id="p_gross" type="number" step="0.01" placeholder="auto-fills from hours × rate, or rate for salary"></div>
      </div>
      <div><button class="btn primary" type="submit" ${emp.length? "" : "disabled"}>Log pay run</button></div>
    </form>
    <table>
      <thead><tr><th>Employee</th><th>Period</th><th style="text-align:right;">Gross pay</th><th></th></tr></thead>
      <tbody>
        ${runs.length? runs.map(r=>`
          <tr>
            <td>${escapeHtml(r.employeeName)}</td>
            <td>${r.periodStart||"—"} to ${r.periodEnd}</td>
            <td style="text-align:right;">${money(r.grossPay)}</td>
            <td><button class="btn ghost small" data-delrun="${r.id}">Remove</button></td>
          </tr>`).join("") : `<tr><td colspan="4"><div class="empty">No pay runs logged yet.</div></td></tr>`}
      </tbody>
    </table>
  `;
  document.getElementById("empForm").onsubmit = (e)=>{
    e.preventDefault();
    const name = val("e_name");
    if(!name) return;
    state.employees.push({id:uid(), name, role:val("e_role"), payType:document.getElementById("e_paytype").value, rate:parseFloat(val("e_rate"))||0});
    logAudit("Payroll", `Added to roster: ${name}`);
    saveState(); renderPayroll(panel);
  };
  panel.querySelectorAll("[data-delemp]").forEach(b=>{
    b.onclick = ()=>{
      const e = state.employees.find(x=>x.id===b.dataset.delemp);
      state.employees = state.employees.filter(x=>x.id!==b.dataset.delemp);
      if(e) logAudit("Payroll", `Removed from roster: ${e.name}`);
      saveState(); renderPayroll(panel);
    };
  });
  const empSelect = document.getElementById("p_emp");
  const hoursInput = document.getElementById("p_hours");
  const grossInput = document.getElementById("p_gross");
  function suggestGross(){
    const employee = state.employees.find(x=>x.id===empSelect.value);
    if(!employee) return;
    if(employee.payType==="hourly"){
      const hrs = parseFloat(hoursInput.value);
      if(hrs) grossInput.value = (hrs*employee.rate).toFixed(2);
    } else {
      grossInput.value = employee.rate.toFixed(2);
    }
  }
  if(empSelect) empSelect.addEventListener("change", suggestGross);
  if(hoursInput) hoursInput.addEventListener("input", suggestGross);
  const payForm = document.getElementById("payForm");
  if(payForm) payForm.onsubmit = (e)=>{
    e.preventDefault();
    const employee = state.employees.find(x=>x.id===empSelect.value);
    const gross = parseFloat(val("p_gross"));
    const periodEnd = val("p_end") || new Date().toISOString().slice(0,10);
    if(!employee || !gross) return;
    state.payRuns.push({id:uid(), employeeId:employee.id, employeeName:employee.name, periodStart:val("p_start"), periodEnd, hours:val("p_hours")||null, grossPay:gross});
    state.finance.transactions.push({id:uid(), type:"expense", category:"Payroll", amount:gross, date:periodEnd, notes:`Pay run: ${employee.name} (${val("p_start")||"—"} to ${periodEnd})`});
    logAudit("Payroll", `Logged pay run: ${employee.name} — ${money(gross)}, posted to Finance as an expense`);
    saveState(); renderPayroll(panel);
  };
  panel.querySelectorAll("[data-delrun]").forEach(b=>{
    b.onclick = ()=>{
      const r = state.payRuns.find(x=>x.id===b.dataset.delrun);
      state.payRuns = state.payRuns.filter(x=>x.id!==b.dataset.delrun);
      if(r) logAudit("Payroll", `Removed pay run: ${r.employeeName}`);
      saveState(); renderPayroll(panel);
    };
  });
}

/* ========================= TAX PREP ========================= */
// Organizes real numbers for a professional — never calculates tax owed,
// determines deductibility, or files anything. Tax rules vary by jurisdiction
// and change; this is a summary tool, not tax advice.
function ensureTaxChecklist(){
  if(state.taxChecklist.length===0){
    ["Confirm business/tax registration is current","Reconcile bank and payment processor statements","Gather sales tax collected and remitted","Gather payroll remittance records (if applicable)","Send this summary and documents to your accountant or tax preparer"]
      .forEach(label=> state.taxChecklist.push({id:uid(), label, done:false}));
  }
}
function renderTaxPrep(panel){
  ensureTaxChecklist();
  const year = window._taxYear || new Date().getFullYear();
  window._taxYear = year;
  const tx = state.finance.transactions.filter(t=>new Date(t.date).getFullYear()===year);
  const income = tx.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount||0),0);
  const expenseByCat = {};
  tx.filter(t=>t.type==="expense").forEach(t=>{ expenseByCat[t.category] = (expenseByCat[t.category]||0) + Number(t.amount||0); });
  const totalExpense = Object.values(expenseByCat).reduce((s,v)=>s+v,0);
  const cats = Object.keys(expenseByCat).sort((a,b)=>expenseByCat[b]-expenseByCat[a]);
  panel.innerHTML = `
    <h2 class="title">Tax Prep${botTag("finance")}</h2>
    <div class="warn-box"><strong>What this is:</strong> a real summary of your logged numbers, organized for a professional. It does not calculate tax owed, determine what's deductible, or file anything — tax rules vary by jurisdiction and change often. Have a qualified accountant or tax preparer review this.</div>
    <div class="field" style="max-width:160px;margin-bottom:16px;"><label>Tax year</label><input id="tax_year" type="number" value="${year}"></div>
    <div class="grid cols-3" style="margin-bottom:20px;">
      <div class="card"><div class="k">Income (${year})</div><div class="v pos">${money(income)}</div></div>
      <div class="card"><div class="k">Expenses (${year})</div><div class="v neg">${money(totalExpense)}</div></div>
      <div class="card"><div class="k">Net</div><div class="v ${income-totalExpense>=0?'pos':'neg'}">${money(income-totalExpense)}</div></div>
    </div>
    <h3 style="font-size:.9rem;margin-bottom:10px;">Expenses by category</h3>
    <table style="margin-bottom:24px;">
      <thead><tr><th>Category</th><th style="text-align:right;">Total</th></tr></thead>
      <tbody>
        ${cats.length? cats.map(c=>`<tr><td>${escapeHtml(c)}</td><td style="text-align:right;">${money(expenseByCat[c])}</td></tr>`).join("") : `<tr><td colspan="2"><div class="empty">No expenses logged for ${year}.</div></td></tr>`}
      </tbody>
    </table>
    <div class="toprow no-print">
      <h3 style="font-size:.9rem;margin:0;">Checklist</h3>
      <button class="btn ghost small" id="exportTaxCsv">Export category summary CSV</button>
    </div>
    <div id="taxChecklistWrap"></div>
  `;
  const checklistWrap = document.getElementById("taxChecklistWrap");
  state.taxChecklist.forEach(item=>{
    const row = document.createElement("label");
    row.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.86rem;border-bottom:1px solid var(--line);";
    row.innerHTML = `<input type="checkbox" data-check="${item.id}" ${item.done?"checked":""}> <span style="${item.done?'text-decoration:line-through;color:var(--text-dim);':''}">${escapeHtml(item.label)}</span>`;
    checklistWrap.appendChild(row);
  });
  checklistWrap.querySelectorAll("[data-check]").forEach(cb=>{
    cb.onchange = ()=>{
      const item = state.taxChecklist.find(x=>x.id===cb.dataset.check);
      if(item){ item.done = cb.checked; saveState(); renderTaxPrep(panel); }
    };
  });
  document.getElementById("tax_year").onchange = (e)=>{
    window._taxYear = parseInt(e.target.value) || new Date().getFullYear();
    renderTaxPrep(panel);
  };
  document.getElementById("exportTaxCsv").onclick = ()=>{
    const csv = toCSV(["Category","Total"], cats.map(c=>[c, expenseByCat[c].toFixed(2)]));
    downloadText(`tax-summary-${year}.csv`, csv);
    logAudit("Tax Prep", `Exported ${year} category summary CSV`);
    saveState();
  };
}

const DOC_CATEGORIES = ["Finance","Customers","Vendors","Employees","Marketing","Legal","Operations","Insurance","Taxes","Corporate"];
const DOC_TEMPLATES = [
  {id:"intake", label:"Customer intake form", category:"Customers", dept:"customers"},

  {id:"vendor_terms", label:"Vendor agreement terms", category:"Vendors", dept:"operations"},

  {id:"sop", label:"Standard operating procedure (SOP)", category:"Operations", dept:"operations"},
  {id:"custom", label:"Custom — describe it below", category:"Operations", dept:"operations"}
];
const DOC_DISCLAIMER = "This is an AI-drafted starting point, not legal, tax, or compliance advice. Have a qualified professional review anything with legal or financial consequences before you use it.";
function docFlag(d){
  if(!d.expiry) return {level:"ok", label:"No expiry"};
  const days = Math.ceil((new Date(d.expiry) - new Date())/86400000);
  if(days < 0) return {level:"expired", label:"Expired"};
  if(days <= 30) return {level:"expiring", label:`Expires in ${days}d`};
  return {level:"ok", label:"Current"};
}
function renderDocuments(panel){
  const list = [...state.documents].sort((a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999"));
  panel.innerHTML = `

        <div class="field"><label>Document type</label>

        </div>
        <div class="field"><label>Drafted by</label>
          <select id="gd_dept">${DEPARTMENTS.map(d=>`<option value="${d.id}">${d.label}${botName(d.id)?` (${botName(d.id)})`:""}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field"><label>Specifics (what makes this document yours)</label><textarea id="gd_specifics" placeholder="e.g. 2-day delivery window, $10 late fee after 5 days, service area is Berwick and Aylesford"></textarea></div>
      <div><button class="btn primary" type="submit" id="gdBtn">Generate draft</button></div>
      <div id="gdStatus" class="ai-loading"></div>
    </form>
    <div id="gdResult"></div>

    <h3 style="font-size:.9rem;margin:26px 0 8px;">Document register</h3>
    <p class="sub" style="margin-bottom:14px;">Tracked items and their expiry status. Generated drafts you save land here too.</p>
    <form class="inline-form" id="docForm">
      <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div class="field"><label>Document name</label><input id="doc_name" required placeholder="e.g. Commercial vehicle insurance"></div>
        <div class="field"><label>Category</label><select id="doc_category">${DOC_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label>Expiry date (optional)</label><input id="doc_expiry" type="date"></div>
      </div>
      <div class="field"><label>Where it's stored / notes</label><input id="doc_notes" placeholder="e.g. Google Drive → Insurance folder"></div>
      <div class="field"><label>Attach a file (optional)</label><input type="file" id="doc_file"></div>
      <div id="doc_file_hint" class="sub" style="margin:0 0 12px;font-size:.76rem;"></div>
      <div><button class="btn primary" type="submit">Add document</button></div>
    </form>
    <table>
      <thead><tr><th>Name</th><th>Category</th><th>Expiry</th><th>Status</th><th>Notes</th><th></th></tr></thead>
      <tbody>
        ${list.length? list.map(d=>{
          const f = docFlag(d);
          return `<tr>
            <td>${escapeHtml(d.name)}${d.bot?`<div style="color:var(--text-dim);font-size:.74rem;">Drafted by ${escapeHtml(d.bot)}</div>`:""}${d.fileName?`<div style="color:var(--text-dim);font-size:.74rem;">📎 ${escapeHtml(d.fileName)}</div>`:""}</td>
            <td>${d.category}</td>
            <td>${d.expiry||"—"}</td>
            <td><span class="doc-flag ${f.level}">${f.label}</span></td>
            <td style="color:var(--text-dim);">${escapeHtml(d.notes||"")}</td>
            <td>
              ${d.content ? `<button class="btn ghost small" data-view="${d.id}">View</button>` : ""}
              ${d.fileData ? `<button class="btn ghost small" data-dlfile="${d.id}">Download file</button>` : ""}
              ${d.fileUrl ? `<a class="btn ghost small" href="${escapeHtml(d.fileUrl)}" target="_blank">Open file</a>` : ""}
              <button class="btn ghost small" data-del="${d.id}">Remove</button>

          </tr>`;
        }).join("") : `<tr><td colspan="6"><div class="empty">No documents tracked yet.</div></td></tr>`}

  document.getElementById("genDocForm").onsubmit = async (e)=>{
    e.preventDefault();
    const typeId = document.getElementById("gd_type").value;

    status.textContent = "Drafting...";
    try{
      const bot = botName(dept) || DEPARTMENTS.find(d=>d.id===dept).label;
      const brandContext = state.business.name ? `The business is "${state.business.name}"${state.business.industry?`, a ${state.business.industry} business`:""}${state.business.location?` in ${state.business.location}`:""}. ` : "";
      const docLabel = tmpl.id==="custom" ? (specifics || "a business document") : tmpl.label;
      const prompt = `You are ${bot}, drafting a ${docLabel} for this business. ${brandContext}${state.brand.voice?`Tone/voice: ${state.brand.voice}. `:""}Specifics to include: ${specifics || "none given — use reasonable placeholders in [brackets] where specific info is needed"}. Write the actual document content, ready to review and adapt. Do not include a legal disclaimer yourself — that will be added separately. Output only the document text.`;
      const text = await callClaude(prompt);
      const fullText = text.trim() + "\n\n---\n" + DOC_DISCLAIMER;
      window._lastGenDoc = {typeId, tmplLabel: tmpl.label, dept, bot, text: fullText};
      document.getElementById("gdResult").innerHTML = `
        <div class="content-item">
          <div class="meta"><span class="badge">${tmpl.label}</span><span>Drafted by ${escapeHtml(bot)}</span></div>
          <textarea class="export" id="gdText" style="min-height:220px;">${escapeHtml(fullText)}</textarea>
          <div class="copy-row">
            <button class="btn primary" id="gdSave">Save to Documents register</button>
            <button class="btn ghost small" id="gdDownload">Download as text file</button>
          </div>
        </div>
      `;
      logAudit("Documents", `${bot} drafted a ${tmpl.label}`);
      saveState();
      status.textContent = "";
      btn.disabled = false;
      document.getElementById("gdSave").onclick = ()=>{
        const finalText = document.getElementById("gdText").value;
        state.documents.push({id:uid(), name:tmpl.label, category:tmpl.category, expiry:"", notes:"AI-drafted — review before use", content:finalText, bot});
        logAudit("Documents", `Saved generated document: ${tmpl.label}`);
        saveState();
        renderDocuments(panel);
      };
      document.getElementById("gdDownload").onclick = ()=>{
        downloadText(`${tmpl.label.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`, document.getElementById("gdText").value, "text/plain");
        logAudit("Documents", `Downloaded generated document: ${tmpl.label}`);
        saveState();
      };
    }catch(err){
      status.textContent = "Couldn't generate a draft — try again.";
      btn.disabled = false;
    }
  };
  const MAX_INLINE_FILE_BYTES = 350000;
  const docFileInput = document.getElementById("doc_file");
  const docFileHint = document.getElementById("doc_file_hint");
  if(docFileInput) docFileInput.addEventListener("change", ()=>{
    const f = docFileInput.files[0];
    if(!f){ docFileHint.textContent = ""; return; }
    if(f.size > MAX_INLINE_FILE_BYTES){
      docFileHint.textContent = `${f.name} is ${(f.size/1024).toFixed(0)}KB — over the ${(MAX_INLINE_FILE_BYTES/1024).toFixed(0)}KB limit for attaching directly here. If you're running the Python backend it'll upload there instead (no size limit); otherwise, keep this one in your usual file storage and just log it above.`;
      docFileHint.style.color = "var(--amber)";
    } else {
      docFileHint.textContent = `${f.name} (${(f.size/1024).toFixed(0)}KB) ready to attach.`;
      docFileHint.style.color = "var(--text-dim);";
    }
  });
  document.getElementById("docForm").onsubmit = async (e)=>{
    e.preventDefault();
    const name = val("doc_name");
    if(!name) return;
    const doc = {id:uid(), name, category:document.getElementById("doc_category").value, expiry:val("doc_expiry"), notes:val("doc_notes")};
    const file = docFileInput && docFileInput.files[0];
    if(file){
      // Real path first: if a backend is actually running (standalone mode),
      // upload the real file there — no size limit, no bloating this app's
      // own storage. Only fall back to embedding the file inline (base64,
      // size-capped) when no backend answers, which is the honest reality
      // for a pure Claude-artifact / phone session.
      let uploaded = false;
      try{
        const form = new FormData();
        form.append("file", file);
        const res = await fetch("/api/upload", {method:"POST", body: form});
        if(res.ok){
          const data = await res.json();
          doc.fileUrl = data.url;
          doc.fileName = file.name;
          uploaded = true;
        }
      }catch(e){ /* no backend reachable — fall through to inline */ }
      if(!uploaded){
        if(file.size <= MAX_INLINE_FILE_BYTES){
          const base64 = await new Promise((resolve, reject)=>{
            const reader = new FileReader();
            reader.onload = ()=>resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          doc.fileData = base64;
          doc.fileName = file.name;
        } else {
          doc.notes = (doc.notes ? doc.notes + " — " : "") + `${file.name} was too large to attach without a backend running; log where it's actually stored instead.`;
        }
      }
    }
    state.documents.push(doc);
    logAudit("Documents", `Added document: ${name}${doc.fileName ? ` (attached ${doc.fileName})` : ""}`);
    saveState(); runAutomations(); renderDocuments(panel);
  };
  panel.querySelectorAll("[data-dlfile]").forEach(b=>{
    b.onclick = ()=>{
      const d = state.documents.find(x=>x.id===b.dataset.dlfile);
      if(!d || !d.fileData) return;
      const a = document.createElement("a");
      a.href = d.fileData;
      a.download = d.fileName || "attachment";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
  });
  panel.querySelectorAll("[data-view]").forEach(b=>{
    b.onclick = ()=>{
      const d = state.documents.find(x=>x.id===b.dataset.view);
      if(!d) return;
      document.getElementById("gdResult").innerHTML = `
        <div class="content-item">
          <div class="meta"><span class="badge">${d.category}</span><span>${d.name}</span></div>
          <textarea class="export" style="min-height:220px;" readonly>${escapeHtml(d.content)}</textarea>
        </div>
      `;
      document.getElementById("gdResult").scrollIntoView({behavior:"smooth"});
    };
  });
  panel.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = ()=>{
      const d = state.documents.find(x=>x.id===b.dataset.del);
      state.documents = state.documents.filter(x=>x.id!==b.dataset.del);
      if(d) logAudit("Documents", `Removed document: ${d.name}`);
      saveState(); renderDocuments(panel);
    };
  });
}

/* ========================= SUPERVISOR ========================= */
// Real AI, grounded only in this business's actual stored data — not a script,
// not a simulated conversation between bots. Answers a question a department
// needs decided; never executes anything on its own.
function buildBusinessContext(){
  const f = computeFinance();
  const openDeals = state.pipeline.filter(d=>d.stage!=="Won"&&d.stage!=="Lost");
  const wonDeals = state.pipeline.filter(d=>d.stage==="Won");
  const openTasks = state.tasks.filter(t=>t.status!=="Done");
  const overdueTasks = openTasks.filter(t=>t.due && new Date(t.due) < new Date());
  const followUps = state.customers.filter(c=>c.followUp && new Date(c.followUp) <= new Date());
  const expiringDocs = state.documents.filter(d=>d.expiry && Math.ceil((new Date(d.expiry)-new Date())/86400000) <= 30);
  const lines = [];
  lines.push(`Business: ${state.business.name||"(not set)"} — ${state.business.industry||"industry not set"} — ${state.business.location||"location not set"}`);
  if(state.brand.voice) lines.push(`Brand voice: ${state.brand.voice}`);
  if(state.business.goalRevenue) lines.push(`Monthly revenue goal: ${state.business.goalRevenue}`);
  lines.push(`Finance: revenue $${f.income.toFixed(2)}, expenses $${f.expense.toFixed(2)}, profit $${f.profit.toFixed(2)}, from ${state.finance.transactions.length} logged transaction(s).`);
  lines.push(`Pipeline: ${openDeals.length} open deal(s) worth $${openDeals.reduce((s,d)=>s+Number(d.value||0),0).toFixed(2)}; ${wonDeals.length} won so far.`);
  lines.push(`Tasks: ${openTasks.length} open, ${overdueTasks.length} overdue.`);
  lines.push(`Customers: ${state.customers.length} on file, ${followUps.length} with a follow-up due now.`);
  lines.push(`Documents: ${expiringDocs.length} expiring within 30 days or already expired.`);
  return lines.join("\n");
}
function buildSupervisorPrompt(deptId, question){
  const supName = botName("supervisor") || "the Supervisor";
  const dept = DEPARTMENTS.find(d=>d.id===deptId);
  const deptLabel = dept ? dept.label : "a department";
  const deptBot = botName(deptId) || deptLabel;
  return `You are ${supName}, the supervisor overseeing this small business's department assistants. The ${deptLabel} department (${deptBot}) has a question and needs a decision. Base your answer only on the real data below — if the data doesn't cover what's needed to answer well, say so plainly and state what's missing rather than guessing.

BUSINESS DATA:
${buildBusinessContext()}

QUESTION FROM ${deptBot.toUpperCase()} (${deptLabel}):
${question}

Give a direct, specific recommendation in under 150 words. This is advice for the owner to act on — you are not taking any action yourself.`;
}
let supervisorPrefill = null;
function renderSupervisor(panel){
  ensureBots();
  const supName = botName("supervisor") || "your Supervisor";
  const log = [...state.supervisorLog].sort((a,b)=>b.ts.localeCompare(a.ts));
  panel.innerHTML = `
    <h2 class="title">Supervisor${botName("supervisor") ? " — "+escapeHtml(botName("supervisor")) : ""}</h2>
    <p class="sub">Real AI, answering from your actual stored data — not a script, and it never acts on its own. This is where a department "asks a question" and gets a grounded recommendation back.</p>
    <form class="inline-form" id="supForm">
      <div class="row" style="display:grid;grid-template-columns:1fr 2fr;gap:10px;">
        <div class="field"><label>Which department is asking?</label>
          <select id="sup_dept">${DEPARTMENTS.map(d=>`<option value="${d.id}">${d.label}${botName(d.id)?` (${botName(d.id)})`:""}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Question / decision needed</label><input id="sup_question" required placeholder="e.g. Should we discount this stalled deal to close it?"></div>
      </div>
      <div><button class="btn primary" type="submit" id="supAskBtn">Ask ${escapeHtml(supName)}</button></div>
      <div id="supStatus" class="ai-loading"></div>
    </form>
    <div id="supLog">
      ${log.length ? log.map(l=>{
        const dept = DEPARTMENTS.find(d=>d.id===l.dept);
        return `<div class="content-item">
          <div class="meta"><span class="badge">${dept?dept.label:l.dept}</span><span>${new Date(l.ts).toLocaleString()}</span></div>
          <div style="font-weight:600;margin-bottom:6px;">${escapeHtml(l.question)}</div>
          <div>${escapeHtml(l.answer).replace(/\n/g,"<br>")}</div>
          <div style="margin-top:8px;">
            ${l.taskCreated ? `<span class="status-line ok">Added to Tasks</span>` : `<button class="btn ghost small" data-mktask="${l.id}">Create task from this</button>`}
          </div>
        </div>`;
      }).join("") : `<div class="empty">No questions asked yet.</div>`}
    </div>
  `;
  if(supervisorPrefill){
    document.getElementById("sup_dept").value = supervisorPrefill.dept;
    document.getElementById("sup_question").value = supervisorPrefill.question;
    supervisorPrefill = null;
  }
  document.getElementById("supForm").onsubmit = async (e)=>{
    e.preventDefault();
    const question = val("sup_question");
    if(!question) return;
    const dept = document.getElementById("sup_dept").value;
    const btn = document.getElementById("supAskBtn");
    const status = document.getElementById("supStatus");
    btn.disabled = true;
    status.textContent = "Thinking it through...";
    try{
      const prompt = buildSupervisorPrompt(dept, question);
      const answer = await callClaude(prompt);
      state.supervisorLog.unshift({id:uid(), dept, question, answer: answer.trim(), ts:new Date().toISOString(), taskCreated:false});
      logAudit("Supervisor", `${DEPARTMENTS.find(d=>d.id===dept).label} asked: ${question}`);
      saveState();
      renderSupervisor(panel);
    }catch(err){
      status.textContent = "Couldn't reach the Supervisor — try again.";
      btn.disabled = false;
    }
  };
  panel.querySelectorAll("[data-mktask]").forEach(b=>{
    b.onclick = ()=>{
      const l = state.supervisorLog.find(x=>x.id===b.dataset.mktask);
      if(!l) return;
      state.tasks.push({id:uid(), title:l.question.slice(0,80), priority:"Medium", due:new Date().toISOString().slice(0,10), status:"Open", supervisorNote:l.answer});
      l.taskCreated = true;
      logAudit("Supervisor", `Turned recommendation into a task: ${l.question.slice(0,60)}`);
      saveState();
      renderSupervisor(panel);
    };
  });
}

    saveState();
    eiStatus.textContent = "Downloaded " + filename + ". Every module is in that file.";
    eiStatus.style.color = "var(--teal)";
  };
  document.getElementById("importAllFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = parsed.state ? parsed.state : parsed;
        if(!incoming || typeof incoming !== "object"){
          eiStatus.textContent = "That file doesn't look like a Foreman export.";
          eiStatus.style.color = "var(--error)";
          return;
        }
        state = Object.assign(defaultState(), incoming);
        logAudit("Data Import", "Imported full business data from " + file.name);
        saveState();
        eiStatus.textContent = "Imported " + file.name + ". Every module now reflects that file.";
        eiStatus.style.color = "var(--teal)";
        render();
      }catch(err){
        eiStatus.textContent = "Couldn't read that file as valid JSON — nothing was changed. (" + err.message + ")";
        eiStatus.style.color = "var(--error)";
      }
    };
    reader.onerror = ()=>{
      eiStatus.textContent = "Couldn't read that file.";
      eiStatus.style.color = "var(--error)";
    };
    reader.readAsText(file);
  });
  function saveCfg(){
    cfg.url = val("bk_url"); cfg.businessId = val("bk_bizid"); cfg.apiKey = val("bk_key");
    saveState();
  }
  function setStatus(text, isError){
    const el = document.getElementById("bk_status");
    el.textContent = text;
    el.style.color = isError ? "var(--error)" : "var(--teal)";
  }
  document.getElementById("bk_health").onclick = async ()=>{
    saveCfg();
    setStatus("Checking...", false);
    try{
      const res = await fetch(cfg.url.replace(/\/$/,"") + "/health");
      if(!res.ok) throw new Error("Server responded with " + res.status);
      const data = await res.json();
      setStatus("Connected — server is reachable and healthy (" + (data.status||"") + ").", false);
    }catch(err){
      setStatus("Couldn't reach the backend at that URL. Is the server actually running? (" + err.message + ")", true);
    }
  };
  document.getElementById("bk_register").onclick = async ()=>{
    saveCfg();
    if(!cfg.url){ setStatus("Enter a backend URL first.", true); return; }
    setStatus("Registering...", false);
    try{
      const res = await fetch(cfg.url.replace(/\/$/,"") + "/register", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({business_name: state.business.name || "Unnamed business"})
      });
      if(!res.ok) throw new Error("Server responded with " + res.status);
      const data = await res.json();
      cfg.businessId = data.business_id; cfg.apiKey = data.api_key;
      document.getElementById("bk_bizid").value = data.business_id;
      document.getElementById("bk_key").value = data.api_key;
      saveCfg();
      logAudit("Backend Sync", "Registered this business on the backend");
      saveState();
      setStatus("Registered. Business ID and API key filled in above — save them, they won't be shown again by the server.", false);
    }catch(err){
      setStatus("Registration failed. Is the backend running at that URL? (" + err.message + ")", true);
    }
  };
  document.getElementById("bk_push").onclick = async ()=>{
    saveCfg();
    if(!cfg.url || !cfg.businessId || !cfg.apiKey){ setStatus("Fill in URL, Business ID, and API key first (or Register above).", true); return; }
    setStatus("Pushing...", false);
    try{
      const res = await fetch(cfg.url.replace(/\/$/,"") + "/state/" + cfg.businessId, {
        method:"PUT", headers:{"Content-Type":"application/json", "X-API-Key":cfg.apiKey},
        body: JSON.stringify({state})
      });
      if(!res.ok) throw new Error("Server responded with " + res.status);
      cfg.lastSync = new Date().toISOString();
      logAudit("Backend Sync", "Pushed local data to backend");
      saveState();
      setStatus("Pushed. This business's data is now saved on the backend server.", false);
      renderBackendSync(panel);
    }catch(err){
      setStatus("Push failed — nothing was overwritten. (" + err.message + ")", true);
    }
  };
  document.getElementById("bk_pull").onclick = async ()=>{
    saveCfg();
    if(!cfg.url || !cfg.businessId || !cfg.apiKey){ setStatus("Fill in URL, Business ID, and API key first.", true); return; }
    setStatus("Pulling...", false);
    try{
      const res = await fetch(cfg.url.replace(/\/$/,"") + "/state/" + cfg.businessId, {
        headers:{"X-API-Key":cfg.apiKey}
      });
      if(!res.ok) throw new Error("Server responded with " + res.status);
      const data = await res.json();
      if(!data.state || Object.keys(data.state).length===0){
        setStatus("Backend has no saved data for this business yet — nothing to pull.", true);
        return;
      }
      state = Object.assign(defaultState(), data.state);
      state.backendConfig = cfg;
      cfg.lastSync = new Date().toISOString();
      logAudit("Backend Sync", "Pulled data from backend, replacing local state");
      saveState();
      setStatus("Pulled. Local data replaced with what was on the backend.", false);
      render();
    }catch(err){
      setStatus("Pull failed — local data was not changed. (" + err.message + ")", true);
    }
  };
}

/* ========================= REPORTS ========================= */
function renderReports(panel){
  const f = computeFinance();
  const now = new Date();
  const weekAgo = new Date(now.getTime()-7*86400000);
  const tx7 = state.finance.transactions.filter(t=>new Date(t.date) >= weekAgo);
  const inc7 = tx7.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount||0),0);
  const exp7 = tx7.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount||0),0);
  const newCustomers7 = state.customers.filter(c=>c._added && new Date(c._added) >= weekAgo).length;
  const wonDeals = state.pipeline.filter(d=>d.stage==="Won");
  const openTasks = state.tasks.filter(t=>t.status!=="Done").length;

  panel.innerHTML = `
    <div class="toprow">
      <div><h2 class="title" style="margin-bottom:2px;">Reports</h2><p class="sub" style="margin:0;">Generated from your stored data — figures only reflect what's been logged in Finance, Customers, Pipeline, and Tasks.</p></div>
      <button class="btn ghost small no-print" id="printReport">Print / Save as PDF</button>
    </div>

    <h3 style="font-size:.9rem;">Last 7 days</h3>
    <div class="grid cols-3" style="margin-bottom:24px;">
      <div class="card"><div class="k">Revenue</div><div class="v pos">${money(inc7)}</div></div>
      <div class="card"><div class="k">Expenses</div><div class="v neg">${money(exp7)}</div></div>
      <div class="card"><div class="k">Net</div><div class="v ${inc7-exp7>=0?'pos':'neg'}">${money(inc7-exp7)}</div></div>
    </div>

    <h3 style="font-size:.9rem;">All-time snapshot</h3>
    <table>
      <tbody>
        <tr><td>Total revenue</td><td style="text-align:right;">${money(f.income)}</td></tr>
        <tr><td>Total expenses</td><td style="text-align:right;">${money(f.expense)}</td></tr>
        <tr><td>Net profit</td><td style="text-align:right;">${money(f.profit)}</td></tr>
        <tr><td>Customers on file</td><td style="text-align:right;">${state.customers.length}</td></tr>
        <tr><td>Deals won</td><td style="text-align:right;">${wonDeals.length} (${money(wonDeals.reduce((s,d)=>s+Number(d.value||0),0))})</td></tr>
        <tr><td>Open tasks</td><td style="text-align:right;">${openTasks}</td></tr>
        <tr><td>Content drafted</td><td style="text-align:right;">${state.content.length}</td></tr>
      </tbody>
    </table>
  `;
  document.getElementById("printReport").onclick = ()=>{
    logAudit("Reports", "Printed / exported report to PDF");
    saveState();
    window.print();
  };
}

/* ========================= ROUTER ========================= */
function render(){
  renderTabs();
  updateHeader();
  const panel = document.getElementById("panel");
  if(activeTab==="dashboard") renderDashboard(panel);
  else if(activeTab==="setup") renderSetup(panel);
  else if(activeTab==="finance") renderFinance(panel);
  else if(activeTab==="invoices") renderInvoices(panel);
  else if(activeTab==="recurring") renderRecurring(panel);
  else if(activeTab==="payroll") renderPayroll(panel);
  else if(activeTab==="crm") renderCrm(panel);
  else if(activeTab==="pipeline") renderPipeline(panel);
  else if(activeTab==="catalog") renderCatalog(panel);
  else if(activeTab==="tasks") renderTasks(panel);
  else if(activeTab==="marketing") renderMarketing(panel);
  else if(activeTab==="vendors") renderVendors(panel);
  else if(activeTab==="inventory") renderInventory(panel);
  else if(activeTab==="locations") renderLocations(panel);
  else if(activeTab==="documents") renderDocuments(panel);
  else if(activeTab==="automations") renderAutomations(panel);
  else if(activeTab==="bots") renderBots(panel);
  else if(activeTab==="supervisor") renderSupervisor(panel);
  else if(activeTab==="connectors") renderConnectors(panel);
  else if(activeTab==="reports") renderReports(panel);
  else if(activeTab==="taxprep") renderTaxPrep(panel);
  else if(activeTab==="audit") renderAuditLog(panel);
  else if(activeTab==="backend") renderBackendSync(panel);
}

(async function init(){
  await loadAll();
  ensureAutomationDefaults();
  runAutomations();
  render();
})();
</script>
